<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilgisayar Mühendisliği PDF Arşivi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sayfa">
    <div class="ust">
      <img src="img/logo.png" alt="Logo" class="logo">
      <h1>Bilgisayar Mühendisliği PDF Arşivi</h1>
    </div>

    <input id="arama" type="search" placeholder="Ders veya PDF ara">

    <section>
      <h2>Dersler</h2>
      <div id="dersler" class="dersler"></div>
    </section>

    <section>
      <div class="secimSatir">
        <h2 id="seciliDers">Bir ders seçiniz</h2>
        <button id="topluIndir" type="button" hidden>Toplu indir</button>
      </div>
      <div id="pdfListe" class="pdfGrid"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
