<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilgisayar Mühendisliği PDF Arşivi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sayfa">
    <header class="ust">
      <img src="img/logo.png" alt="Site logosu" class="logo">
      <div>
        <h1>Bilgisayar Mühendisliği PDF Arşivi</h1>
        <p>Dersi seçin, PDF'ler iki sütunda ve sayfa içinde açılsın.</p>
      </div>
    </header>

    <section class="aramaBolum">
      <input id="arama" type="search" placeholder="Ders veya PDF ara">
    </section>

    <section>
      <h2>Dersler</h2>
      <div id="dersler" class="dersler"></div>
    </section>

    <section>
      <h2 id="seciliDers">Bir ders seçiniz</h2>
      <div id="pdfListe" class="pdfGrid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
